[package]
name = "mir-azure"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "mir-azure"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio", "ssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"] }
bytes = "1.9"
aws-config = { version = "1.8.17", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.120.0", default-features = false, features = ["rustls", "rt-tokio"] }
thiserror = "2.0.18"
clap = { version = "4.5.54", features = ["derive", "env"] }
nauron-contracts = { git = "https://github.com/nauron-ai/nauron-contracts.git", tag = "0.1.0" }
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
tokio-stream = "0.1.18"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.12", features = ["v4", "fast-rng"] }
